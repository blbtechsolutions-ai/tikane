version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tikane_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tikane_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tikane_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - tikane_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: tikane_backend_prod
    restart: always
    env_file:
      - ./backend/.env.production
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tikane_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: tikane_frontend_prod
    restart: always
    expose:
      - '80'
    depends_on:
      - backend
    networks:
      - tikane_network

  nginx:
    image: nginx:alpine
    container_name: tikane_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - tikane_network

volumes:
  postgres_data:
  redis_data:
  certbot_data:

networks:
  tikane_network:
    driver: bridge
